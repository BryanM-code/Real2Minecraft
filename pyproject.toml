[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

# Only the shared voxel core is installable. The Real2Minecraft app itself (app.py,
# building/, the viewers, the TRELLIS client) stays a set of scripts run from this folder.
[project]
name = "mcvoxel"
version = "0.6.1"
description = "Mesh to Minecraft block voxelisation core shared by Real2Minecraft and BuildDataCollector"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "trimesh>=4.0",
    "Pillow>=10.0",
    "nbtlib>=2.0",
    "networkx>=3.0",   # trimesh.repair.fill_holes
    "rtree>=1.0",      # trimesh.proximity.closest_point
]

[tool.setuptools]
packages = ["mcvoxel"]

# The vocabulary's target-version block table (mcvoxel/blocktables/blocks_1_21_11.json).
# Not under a folder named data/: .gitignore keeps every data/ folder out of the repo.
[tool.setuptools.package-data]
mcvoxel = ["blocktables/*.json"]
